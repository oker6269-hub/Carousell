name: Build Carousell Collector

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target_arch: ""
          - os: macos-14          # Apple Silicon runner；arm64 原生构建
            platform: macos-arm64
            target_arch: ""
          - os: macos-14          # 同一 runner 交叉构建 Intel 版（universal2 Python）
            platform: macos-x64
            target_arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      CC_TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show interpreter arch
        run: python -c "import platform,sys;print(platform.machine(), sys.version)"

      - name: Build (PyInstaller)
        run: pyinstaller build.spec --noconfirm --distpath dist --workpath build_tmp

      - name: Verify binary arch (macOS)
        if: runner.os == 'macOS'
        run: |
          file dist/CarousellCollector/CarousellCollector || true
          lipo -info dist/CarousellCollector/CarousellCollector || true

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/CarousellCollector" -DestinationPath "CarousellCollector-${{ matrix.platform }}.zip"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/CarousellCollector.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/CarousellCollector.app" "CarousellCollector-${{ matrix.platform }}.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/CarousellCollector" "CarousellCollector-${{ matrix.platform }}.zip"
          fi
          tar -czf "CarousellCollector-${{ matrix.platform }}-cli.tar.gz" -C dist CarousellCollector
          ls -lh *.zip *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarousellCollector-${{ matrix.platform }}
          path: |
            CarousellCollector-${{ matrix.platform }}.zip
            CarousellCollector-${{ matrix.platform }}-cli.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CarousellCollector-${{ matrix.platform }}.zip
            CarousellCollector-${{ matrix.platform }}-cli.tar.gz
          generate_release_notes: true
