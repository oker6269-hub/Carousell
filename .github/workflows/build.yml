name: Build Carousell Collector

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: zip
          - os: macos-latest
            platform: macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: pyinstaller build.spec --noconfirm --distpath dist --workpath build_tmp

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/CarousellCollector" -DestinationPath "CarousellCollector-${{ matrix.platform }}.zip"

      - name: Package artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          tar -czf "CarousellCollector-${{ matrix.platform }}.tar.gz" dist/CarousellCollector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarousellCollector-${{ matrix.platform }}
          path: |
            CarousellCollector-${{ matrix.platform }}.${{ matrix.ext }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CarousellCollector-${{ matrix.platform }}.${{ matrix.ext }}
